databases:
  - name: tisaal-db
    plan: free

services:
  - type: web
    name: tisaal-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tisaal-db
          property: connectionString
